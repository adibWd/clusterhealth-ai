global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Raw GPU/CPU cluster telemetry (real DCGM/Node Exporter in production;
  # metrics_exporter.py simulating a live cluster for the hackathon demo)
  - job_name: "clusterhealth_gpu_metrics"
    static_configs:
      - targets: ["metrics-exporter:9400"]

  # The AI's own predicted failure risk per device, re-published so it can
  # be charted on the SAME timeline as the raw hardware metrics above
  - job_name: "clusterhealth_ai_risk_score"
    static_configs:
      - targets: ["risk-exporter:9500"]

  # Prometheus monitoring itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
