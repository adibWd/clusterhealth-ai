# ClusterHealth AI -- reference Kubernetes deployment (production roadmap).
# Not required to run the hackathon demo (that's local via uvicorn), but
# show this file to judges to prove you've thought past the notebook stage
# and understand real cloud-native deployment.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: clusterhealth-api
  labels:
    app: clusterhealth-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clusterhealth-ai
  template:
    metadata:
      labels:
        app: clusterhealth-ai
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clusterhealth-api
          image: your-registry/clusterhealth-ai:latest
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus-server.monitoring.svc.cluster.local:9090"
          readinessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8000 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: clusterhealth-api
spec:
  selector:
    app: clusterhealth-ai
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
---
# ServiceMonitor lets Prometheus Operator scrape this API's own metrics
# (request latency, prediction counts) -- the "AI monitoring the AI" story.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clusterhealth-api
spec:
  selector:
    matchLabels:
      app: clusterhealth-ai
  endpoints:
    - port: http
      interval: 30s
